<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildfire | Mongolia 2026
    </title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">


    <script type="module" src="js/bootstrap.bundle.min.js"></script>

</head>

<body>
    <!-- Navigation bar -->
    <!-- with drawer menu on smaller screen -->
    <nav class="navbar sm:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Wildfire | Mongolia 2026</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavAltMarkup"
                aria-labelledby="navbarNavAltMarkupLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarNavAltMarkupLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <div class="nav nav-pills navbar-nav">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                        <a class="nav-link" href="about.html">About Me</a>
                        <a class="nav-link" href="contact.html">Contact Us</a>
                    </div>
                </div>
            </dialog>
        </div>
    </nav>



    <!-- Main content -->
    <div class="container">
        <div id="carouselExampleDark" class="carousel carousel-overlay slide" data-bs-theme="dark">
            <div class="carousel-inner">
                <div class="carousel-item active" data-bs-interval="10000">
                    <img src="images/grass2.jpg" class="d-block w-100 h-100 rounded-5" alt="...">
                </div>
                <div class="carousel-item" data-bs-interval="2000">
                    <img src="images/banner6.jpg" class="d-block w-100 h-100 rounded-5" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="images/banner2.png" class="d-block w-100 h-100 rounded-5" alt="...">
                </div>
            </div>
            <div class="carousel-overlay-controls">
                <button class="btn-icon btn-sm btn-subtle theme-secondary" type="button"
                    data-bs-target="#carouselExampleDark" data-bs-slide="prev">
                    <span class="carousel-icon-prev" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active"
                        aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                </div>
                <button class="btn-icon btn-sm btn-subtle theme-secondary" type="button"
                    data-bs-target="#carouselExampleDark" data-bs-slide="next">
                    <span class="carousel-icon-next" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

    </div>






    <!-- Footer -->



</body>

</html>
