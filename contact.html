<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildfire | Mongolia 2026
    </title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">


    <script type="module" src="js/bootstrap.bundle.min.js"></script>

</head>

<body>
    <!-- Navigation bar -->
    <!-- with drawer menu on smaller screen -->
    <nav class="navbar sm:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Wildfire | Mongolia 2026</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavAltMarkup"
                aria-labelledby="navbarNavAltMarkupLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarNavAltMarkupLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <div class="nav nav-pills navbar-nav">
                        <a class="nav-link" href="index.html">Home</a>
                        <a class="nav-link" href="about.html">About Me</a>
                        <a class="nav-link active" aria-current="page" href="contact.html">Contact Us</a>
                    </div>
                </div>
            </dialog>
        </div>
    </nav>

    <!-- main contact section -->
    <div class="container mt-5">

        <form>


            <div class="row g-3">
                <h1 class="mb-3">Contact Us</h1>
                <p class="mb-3">Please fill out the form below to get in touch.</p>

                <div class="col-12 md:col-6">
                    <h3 class="mb-3">Your Information</h3>
                    <label for="sizesInputDefault" class="form-label">First Name*</label>
                    <input class="form-control" type="text" id="sizesInputDefault" placeholder="First Name"
                        aria-label="Default input example">
                </div>
                <div class="col-12 md:col-6">
                    <label for="sizesInputLarge" class="form-label">Last Name*</label>
                    <input class="form-control" type="text" id="sizesInputLarge" placeholder="Last Name"
                        aria-label="Large input example">
                </div>
                <div class="col-12 md:col-6">
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Email*</label>
                        <input type="email" class="form-control" id="exampleInputEmail1" placeholder="email@domain.com"
                            aria-describedby="emailHelp">
                        <div id="emailHelp" class="form-text">We’ll never share your email with anyone else.</div>
                    </div>

                </div>
                <hr class="my-5">


                <div class="col-12">

                    <div class="form-field">
                        <label for="exampleFormControlTextarea1" class="form-label">Message*</label>
                        <textarea class="form-control" id="exampleFormControlTextarea1"></textarea>
                    </div>
                </div>
            </div>

            <div class="mb-3 form-field">
                <input type="checkbox" id="exampleCheck1" class="check">
                <label for="exampleCheck1">I would like to receive project updates</label>
            </div>
            <button type="submit" class="btn-solid theme-primary">Submit</button>
        </form>

    </div>




    <!-- Footer -->
    <div class="container fluid mt-5">
        <div class="p-3 bg-1 order d-flex justify-content-center">
            <p>&copy; 2026 Livia Hu - University of Toronto</p>
        </div>
    </div>
</body>

</html>
